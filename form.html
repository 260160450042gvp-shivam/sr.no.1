<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
</head>
<body style="margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; height: 100vh; display: flex; justify-content: center; align-items: center;">

  <div style="background-color: #ffffff; width: 100%; max-width: 400px; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); box-sizing: border-box;">
    
    <!-- Title Section -->
    <div style="text-align: center; margin-bottom: 30px;">
      <h2 style="margin: 0 0 8px 0; color: #333333; font-size: 28px; font-weight: 600;">Welcome Back</h2>
      <p style="margin: 0; color: #777777; font-size: 14px;">Please enter your details to log in.</p>
    </div>

    <!-- Login Form -->
    <form style="display: flex; flex-direction: column;">
      
      <!-- Email Input -->
      <div style="margin-bottom: 20px;">
        <label for="email" style="display: block; margin-bottom: 8px; color: #444444; font-size: 14px; font-weight: 500;">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required style="width: 100%; padding: 12px 16px; border: 1px solid #cccccc; border-radius: 6px; font-size: 14px; outline: none; box-sizing: border-box;">
      </div>

      <!-- Password Input -->
      <div style="margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <label for="password" style="color: #444444; font-size: 14px; font-weight: 500;">Password</label>
          <a href="#" style="color: #4f46e5; font-size: 13px; text-decoration: none; font-weight: 500;">Forgot?</a>
        </div>
        <input type="password" id="password" name="password" placeholder="••••••••" required style="width: 100%; padding: 12px 16px; border: 1px solid #cccccc; border-radius: 6px; font-size: 14px; outline: none; box-sizing: border-box;">
      </div>

      <!-- Remember Me Checkbox -->
      <div style="display: flex; align-items: center; margin-bottom: 24px;">
        <input type="checkbox" id="remember" style="margin-right: 8px; width: 16px; height: 16px; cursor: pointer;">
        <label for="remember" style="color: #666666; font-size: 14px; cursor: pointer;">Remember me for 30 days</label>
      </div>

      <!-- Submit Button -->
      <button type="submit" style="width: 100%; background-color: #4f46e5; color: #ffffff; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer;">
        Sign In
      </button>

    </form>

    <!-- Footer Links -->
    <div style="text-align: center; margin-top: 24px;">
      <p style="margin: 0; color: #666666; font-size: 14px;">
        Don't have an account? 
        <a href="#" style="color: #4f46e5; text-decoration: none; font-weight: 600;">Sign up</a>
      </p>
    </div>

  </div>

</body>
</html>
