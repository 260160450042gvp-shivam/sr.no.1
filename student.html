<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result</title>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1B2A4A 0%, #0F1830 100%);
            padding: 30px 16px;
        }

        .result {
            background: #ffffff;
            width: 480px;
            max-width: 100%;
            padding: 36px 32px 32px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            box-shadow: 0 20px 45px rgba(15, 24, 48, 0.35);
        }

        .header {
            text-align: center;
        }

        .header .icon {
            font-size: 34px;
            display: flex;
            justify-content: center;
            margin-bottom: 6px;
        }

        .header h2 {
            color: #1B2A4A;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .header p {
            padding-top: 8px;
            color: #6b6f7d;
            font-size: 0.92rem;
        }

        .field {
            width: 100%;
        }

        label {
            display: block;
            padding-bottom: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #1B2A4A;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 16px;
            border: 1px solid #d9dce3;
            border-radius: 25px;
            outline: none;
            font-size: 0.95rem;
            color: #232323;
            background: #f7f8fa;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input::placeholder {
            color: #9aa0ac;
        }

        input:focus {
            border-color: #C1622D;
            box-shadow: 0 0 0 3px rgba(193, 98, 45, 0.15);
            background: #fff;
        }

        button {
            height: 46px;
            width: 100%;
            border: none;
            border-radius: 25px;
            background: #1B2A4A;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        button:hover {
            background: #C1622D;
        }

        button:active {
            transform: scale(0.98);
        }

        button:focus-visible {
            outline: 2px solid #C1622D;
            outline-offset: 3px;
        }

        #output {
            width: 100%;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.35s ease, max-height 0.35s ease;
        }

        #output.show {
            opacity: 1;
            max-height: 400px;
        }

        #output h3 {
            color: #1B2A4A;
            font-size: 1.05rem;
            padding-bottom: 12px;
            border-bottom: 1px solid #e6e8ee;
            margin-bottom: 10px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 0.92rem;
            color: #3d3d38;
            border-bottom: 1px dashed #e6e8ee;
        }

        .row:last-child {
            border-bottom: none;
        }

        .row span:first-child {
            color: #6b6f7d;
        }

        .row span:last-child {
            font-weight: 600;
            color: #1B2A4A;
        }

        .badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
        }

        .badge.pass {
            background: #2E8B57;
        }

        .badge.fail {
            background: #C1392B;
        }

        @media (max-width: 480px) {
            .result {
                padding: 28px 22px 26px;
                border-radius: 14px;
            }
        }
    </style>
</head>

<body>
    <div id="result" class="result">
        <div class="header">
            <div class="icon">🎓</div>
            <h2>Student Result Portal</h2>
            <p>Enter marks below to calculate the result</p>
        </div>

        <div class="field">
            <label for="name">Student Name</label>
            <input type="text" id="name" placeholder="Enter full name">
        </div>

        <div class="field">
            <label for="java">Java Marks</label>
            <input type="number" id="java" placeholder="Out of 100">
        </div>

        <div class="field">
            <label for="dbms">DBMS Marks</label>
            <input type="number" id="dbms" placeholder="Out of 100">
        </div>

        <div class="field">
            <label for="dsa">DSA Marks</label>
            <input type="number" id="dsa" placeholder="Out of 100">
        </div>

        <button type="button" onclick="calculator()">Calculate Result</button>

        <div id="output"></div>
    </div>

    <script>
        function calculator() {
            var name = document.getElementById("name").value;
            var java = Number(document.getElementById("java").value);
            var dbms = Number(document.getElementById("dbms").value);
            var dsa = Number(document.getElementById("dsa").value);
            var Total = java + dbms + dsa;
            var Percentage = Total / 3;
            var Result;

            if (java >= 35 && dbms >= 35 && dsa >= 35) {
                Result = "Pass";
            } else {
                Result = "Fail";
            }

            var badgeClass = Result === "Pass" ? "pass" : "fail";

            var outputDiv = document.getElementById("output");

            outputDiv.innerHTML =
                "<h3>Result Summary</h3>" +
                "<div class='row'><span>Student Name</span><span>" + name + "</span></div>" +
                "<div class='row'><span>Java</span><span>" + java + "</span></div>" +
                "<div class='row'><span>DBMS</span><span>" + dbms + "</span></div>" +
                "<div class='row'><span>DSA</span><span>" + dsa + "</span></div>" +
                "<div class='row'><span>Total</span><span>" + Total + " / 300</span></div>" +
                "<div class='row'><span>Percentage</span><span>" + Percentage.toFixed() + "%</span></div>" +
                "<div class='row'><span>Result</span><span class='badge " + badgeClass + "'>" + Result + "</span></div>";

            outputDiv.classList.remove("show");
            void outputDiv.offsetWidth;
            outputDiv.classList.add("show");
        }
    </script>
</body>

</html>
