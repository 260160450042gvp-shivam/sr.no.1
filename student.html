<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result</title>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body{
            font-family: arial;
            height: 95vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .header p{
            padding-top: 15px;
        }
        .result{
            background-color: gray;
            width: 50%;
            padding: 30px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .icon{
            font-size: 30px;
            display: flex;
            flex-direction: row;
            justify-content: center;
        }
        label{
            padding: 8px;
            
        }
        input{
            width: 30vh;
            height: 4.5vh;
            padding: 5px;
            margin-top: 5px;
            border-radius: 25px;
            outline: none;
        }
        button{
            height: 4.5vh;
            width: 25vh;
            border-radius: 50px 0;

        }
        .output, h3{
            padding-bottom: 15px;
        }
    </style>
</head>

<body>
    <div id="result" class="result">
        <div class="header">
            <div class="icon">🎓</div>
            <h2>Student Result Portal</h2>
            <p>Enter marks below to calculate the result</p>
        </div>

        <div class="field">
            <label>Student Name</label><br>
            <input type="text" name="" id="name" placeholder="Enter full name">
        </div>

        <div class="field">
            <label>Java Marks</label><br>
            <input type="number" name="" id="java" placeholder="Out of 100">
        </div>

        <div class="field">
            <label>DBMS Marks</label><br>
            <input type="number" name="" id="dbms" placeholder="Out of 100">
        </div>

        <div class="field">
            <label>DSA Marks</label><br>
            <input type="number" name="" id="dsa" placeholder="Out of 100">
        </div>

        <button type="button" onclick="calculator()">Calculate Result</button>

        <div id="output"></div>
    </div>

    <script>
        function calculator() {
            var name = document.getElementById("name").value;
            var java = Number(document.getElementById("java").value);
            var dbms = Number(document.getElementById("dbms").value);
            var dsa = Number(document.getElementById("dsa").value);
            var Total = java + dbms + dsa;
            var Percentage = Total / 3;
            var Result;

            if (java >= 35 && dbms >= 35 && dsa >= 35) {
                Result = "Pass";
            } else {
                Result = "Fail";
            }

            var badgeClass = Result === "Pass" ? "pass" : "fail";

            var outputDiv = document.getElementById("output");

            outputDiv.innerHTML =
                "<h3>Result Summary</h3>" +
                "<div class='row'><span>Student Name : </span><span>" + name + "</span></div>" +
                "<div class='row'><span>Java : </span><span>" + java + "</span></div>" +
                "<div class='row'><span>DBMS : </span><span>" + dbms + "</span></div>" +
                "<div class='row'><span>DSA : </span><span>" + dsa + "</span></div>" +
                "<div class='row'><span>Total : </span><span>" + Total + " / 300</span></div>" +
                "<div class='row'><span>Percentage : </span><span>" + Percentage.toFixed() + "%</span></div>" +
                "<div class='row'><span>Result : </span><span class='badge " + badgeClass + "'>" + Result + "</span></div>";

            outputDiv.classList.remove("show");
            void outputDiv.offsetWidth;
            outputDiv.classList.add("show");
        }
    </script>
</body>

</html>
